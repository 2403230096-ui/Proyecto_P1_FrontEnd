<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MageMan ZX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <!--    Parte Inicial del MiniBlog      -->
    <header class="site-header">
        <div class="container">
            <div>
                <img src="https://i.pinimg.com/736x/6e/37/be/6e37becde8194a10199e096ed895374d.jpg"
                     alt="Megaman ZX / Nintendo DS Cover">
 
                <a href="#" class="Logo">Megaman ZX</a>
 
                <nav aria-label="Navegacion Principal">
                    <ul class="site-nav" id="main-nav">
                        <li><a href="#">Inicio</a></li>
                        <li><a href="#">Historia</a></li>
                        <li><a href="#">Personajes</a></li>
                        <li><a href="#">Galeria</a></li>
                    </ul>
                </nav>
 
                <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" id="nav-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>
 
    <main>
 
    </main>
 
    <script>
        const toggle = document.getElementById('nav-toggle');
        const nav    = document.getElementById('main-nav');
 
        toggle.addEventListener('click', () => {
            const open = nav.classList.toggle('open');
            toggle.setAttribute('aria-expanded', open);
 
            const spans = toggle.querySelectorAll('span');
            if (open) {
                spans[0].style.transform = 'translateY(6.5px) rotate(45deg)';
                spans[1].style.opacity   = '0';
                spans[2].style.transform = 'translateY(-6.5px) rotate(-45deg)';
            } else {
                spans.forEach(s => { s.style.transform = ''; s.style.opacity = ''; });
            }
        });
 
        document.addEventListener('click', (e) => {
            if (!toggle.contains(e.target) && !nav.contains(e.target)) {
                nav.classList.remove('open');
                toggle.setAttribute('aria-expanded', 'false');
                toggle.querySelectorAll('span').forEach(s => {
                    s.style.transform = ''; s.style.opacity = '';
                });
            }
        });
    </script>
 
</body>
</html>
